<!DOCTYPE html>
<html lang="en" data-theme-default="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>April Gate — Shipment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --mono:'Share Tech Mono',monospace; --display:'Bebas Neue',sans-serif; --body:'DM Sans',sans-serif; }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); font-family:var(--body); font-weight:300; line-height:1.7; }
    .container { max-width:860px; margin:0 auto; padding:0 2rem; position:relative; z-index:1; }

    nav { position:fixed; top:0; left:0; right:0; z-index:100; padding:1.2rem 2rem; display:flex; align-items:center; justify-content:space-between; background:var(--nav-bg); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); }
    .nav-logo { font-family:var(--mono); font-size:0.85rem; color:var(--accent); letter-spacing:0.15em; text-transform:uppercase; text-decoration:none; }
    .nav-logo span { color:var(--text-dim); margin:0 0.5rem; }
    .nav-mid { display:flex; gap:0.75rem; align-items:center; flex-wrap:wrap; }
    .nav-tag { font-family:var(--mono); font-size:0.7rem; color:var(--nav-fg); letter-spacing:0.1em; border:1px solid var(--border); padding:0.3rem 0.8rem; border-radius:2px; text-decoration:none; }
    .nav-tag:hover,.nav-tag.active { color:var(--accent); border-color:var(--accent); }
    .nav-cta { font-family:var(--mono); font-size:0.72rem; letter-spacing:0.12em; text-transform:uppercase; background:var(--accent); color:var(--bg); border:1px solid var(--accent); padding:0.42rem 1.05rem; border-radius:2px; text-decoration:none; font-weight:500; }
    .btn-signin { font-family:var(--mono); font-size:0.7rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-dim); background:transparent; border:1px solid var(--border); padding:0.3rem 0.9rem; border-radius:2px; opacity:0.5; cursor:not-allowed; }

    main { padding:8rem 0 4rem; }
    .crumb { font-family:var(--mono); font-size:0.7rem; color:var(--text-dim); letter-spacing:0.1em; margin-bottom:1rem; }
    .crumb a { color:var(--accent); text-decoration:none; }
    .banner { display:none; background:var(--accent-dim); border:1px solid var(--accent); color:var(--text-bright); font-family:var(--mono); font-size:0.75rem; letter-spacing:0.05em; padding:0.85rem 1.1rem; border-radius:2px; margin-bottom:1.5rem; }
    .banner.show { display:block; }
    h1 { font-family:var(--display); font-size:clamp(2.2rem,4vw,3rem); color:var(--text-bright); letter-spacing:0.02em; line-height:1; margin-bottom:0.5rem; }
    .tier-badge { display:inline-block; font-family:var(--mono); font-size:0.62rem; letter-spacing:0.1em; text-transform:uppercase; padding:0.2rem 0.6rem; border-radius:2px; border:1px solid; margin-bottom:2rem; }
    .tier-Essential { color:var(--ink-3); border-color:var(--border-2); }
    .tier-Assured { color:var(--accent); border-color:var(--accent); }
    .tier-Fortified { color:var(--gold); border-color:var(--gold); }

    .card { background:var(--surface); border:1px solid var(--border); padding:1.5rem 1.75rem; margin-bottom:1.5rem; }
    .card h2 { font-family:var(--mono); font-size:0.72rem; color:var(--accent); letter-spacing:0.18em; text-transform:uppercase; margin-bottom:1.25rem; }
    .row { display:flex; justify-content:space-between; gap:1rem; padding:0.6rem 0; border-bottom:1px solid var(--border); }
    .row:last-child { border-bottom:none; }
    .row .k { font-family:var(--mono); font-size:0.66rem; color:var(--text-dim); letter-spacing:0.1em; text-transform:uppercase; }
    .row .v { font-family:var(--mono); font-size:0.85rem; color:var(--text-bright); text-align:right; word-break:break-word; }
    .v a { color:var(--accent); text-decoration:none; }
    .copy-btn { font-family:var(--mono); font-size:0.6rem; background:transparent; border:1px solid var(--border); color:var(--text-dim); padding:0.1rem 0.45rem; cursor:pointer; border-radius:2px; margin-left:0.5rem; }
    .copy-btn:hover { color:var(--accent); border-color:var(--accent); }
    .muted { color:var(--text-dim); font-family:var(--mono); font-size:0.78rem; }
    .actions { display:flex; gap:1rem; flex-wrap:wrap; margin-top:0.5rem; }
    .btn-primary { display:inline-flex; align-items:center; gap:0.5rem; background:var(--accent); color:var(--bg); font-family:var(--mono); font-size:0.78rem; letter-spacing:0.12em; text-transform:uppercase; padding:0.8rem 1.5rem; text-decoration:none; clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%); }
    .btn-secondary { display:inline-flex; align-items:center; gap:0.5rem; background:transparent; color:var(--text); font-family:var(--mono); font-size:0.78rem; letter-spacing:0.12em; text-transform:uppercase; padding:0.8rem 1.5rem; text-decoration:none; border:1px solid var(--border); }
    .btn-secondary:hover { border-color:var(--accent); color:var(--accent); }
    .onchain-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:0.5rem; background:var(--text-dim); }
    .onchain-dot.ok { background:var(--accent); }
    .onchain-dot.bad { background:var(--warn); }
    .dev-tablewrap { overflow-x:auto; }
    .dev-table { width:100%; border-collapse:collapse; font-family:var(--mono); font-size:0.72rem; }
    .dev-table th { text-align:left; color:var(--text-dim); font-weight:400; letter-spacing:0.1em; text-transform:uppercase; font-size:0.58rem; padding:0.4rem 0.6rem 0.4rem 0; border-bottom:1px solid var(--border); white-space:nowrap; }
    .dev-table td { padding:0.5rem 0.6rem 0.5rem 0; border-bottom:1px solid var(--border); color:var(--text-bright); white-space:nowrap; }
    .dev-table tr:last-child td { border-bottom:none; }
    .dev-table td.ok { color:var(--accent); }
    .dev-table td.ended { color:var(--text-dim); }
    .dev-table a { color:var(--accent); text-decoration:none; }
    @media (max-width:820px){ .nav-mid .nav-tag{display:none;} }
  </style>
  <link rel="stylesheet" href="/theme.css">
  <script src="/theme.js"></script>
  <link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
  <nav>
    <a href="/index.html" class="nav-logo"><img src="/logo.png" alt="April Gate" style="height:34px;width:auto;display:block;border-radius:5px;" /></a>
    <div class="nav-mid">
      <a href="/how-it-works.html" class="nav-tag">Legal &amp; Compliance</a>
      <a href="/verify.html" class="nav-tag">Verify</a>
      <a href="/team.html" class="nav-tag">Team</a>
      <a href="/waitlist.html" class="nav-cta">★ Waitlist</a>
      <a href="/operator/" class="nav-tag active">Operator Portal</a>
      <button class="theme-toggle" type="button" onclick="toggleTheme()"></button>
      <button class="btn-signin" type="button" disabled title="Auth coming soon — demo runs unauthenticated" aria-disabled="true">Sign In</button>
    </div>
  </nav>

  <main>
    <div class="container">
      <div class="crumb"><a href="/operator/">← Operator Portal</a></div>
      <div class="banner" id="banner">✓ Shipment created on-chain (devnet). Below is its record.</div>
      <div id="content"><p class="muted">Loading shipment…</p></div>
    </div>
  </main>

  <script>
    (function () {
      var DEVNET_RPC = "https://api.devnet.solana.com";
      // id comes from the path /operator/shipment/<id> (served via _redirects rewrite)
      var parts = location.pathname.replace(/\/+$/,"").split("/");
      var shipmentId = decodeURIComponent(parts[parts.length-1] || "");
      var params = new URLSearchParams(location.search);
      if (params.get("created")) document.getElementById("banner").classList.add("show");

      var contentEl = document.getElementById("content");
      function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
      function row(k,v){ return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'; }
      window.copyId = function(btn, id){ navigator.clipboard.writeText(id).then(function(){var t=btn.textContent;btn.textContent="✓";setTimeout(function(){btn.textContent=t;},1200);}); };

      function shortKey(k){ return k.length > 14 ? k.slice(0,8)+"…"+k.slice(-4) : k; }
      function fmtTs(sec){
        if (!sec) return "—";
        var d = new Date(sec * 1000);
        return isNaN(d) ? "—" : d.toLocaleString();
      }

      // ── Browser-side fallback ────────────────────────────────────────────
      // Public devnet blocks getProgramAccounts from some networks, Cloudflare's
      // edge among them. Browser IPs are not blocked, so if the Worker route
      // can't read the chain we run the identical query from here rather than
      // dead-ending the list. Same filters, same offsets — only the caller moves.
      var PROGRAM_ID = "APRBVwwJJeStD5wShyg4HivneDYj4TCPYKtSFX5F4jez";
      var DEVICE_ASSIGNMENT_SIZE = 129;
      var B58 = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
      function b58encode(bytes){
        var digits=[0],i,j,carry;
        for(i=0;i<bytes.length;i++){ carry=bytes[i];
          for(j=0;j<digits.length;j++){ carry+=digits[j]<<8; digits[j]=carry%58; carry=(carry/58)|0; }
          while(carry){ digits.push(carry%58); carry=(carry/58)|0; } }
        var out=""; for(i=0;i<bytes.length&&bytes[i]===0;i++) out+="1";
        for(j=digits.length-1;j>=0;j--) out+=B58[digits[j]];
        return out;
      }
      function b64ToBytes(b64){ var s=atob(b64),a=new Uint8Array(s.length); for(var i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a; }
      function u32le(b,o){ return (b[o]|(b[o+1]<<8)|(b[o+2]<<16)|(b[o+3]<<24))>>>0; }
      function i64le(b,o){ var v=0n; for(var i=7;i>=0;i--) v=(v<<8n)|BigInt(b[o+i]); if(v>=1n<<63n) v-=1n<<64n; return Number(v); }

      function loadAssignmentsFromChain(){
        return fetch(DEVNET_RPC, { method:"POST", headers:{"content-type":"application/json"},
          body: JSON.stringify({ jsonrpc:"2.0", id:1, method:"getProgramAccounts", params:[PROGRAM_ID, {
            encoding:"base64",
            filters:[ { dataSize: DEVICE_ASSIGNMENT_SIZE }, { memcmp:{ offset:40, bytes: shipmentId } } ]
          }]}) })
          .then(function(r){ return r.json(); })
          .then(function(j){
            if (j.error) throw new Error(j.error.message || "getProgramAccounts failed");
            var list = (j.result||[]).map(function(a){
              var b = b64ToBytes(a.account.data[0]);
              return {
                assignment_pubkey: a.pubkey,
                device_pubkey: b58encode(b.slice(8,40)),
                sequence: u32le(b,72),
                authority: b58encode(b.slice(76,108)),
                assigned_at: i64le(b,108),
                ended_at: i64le(b,116),
                proof_count: u32le(b,124)
              };
            });
            list.sort(function(x,y){ return x.assigned_at-y.assigned_at || x.sequence-y.sequence; });
            return { shipment_id: shipmentId, count: list.length, assignments: list };
          });
      }

      // Assigned devices come from DeviceAssignment accounts on-chain — never
      // from a database — so the list cannot drift from what the program says.
      function loadAssignments(){
        var body = document.getElementById("devicesBody");
        if (!body) return;
        fetch("/api/shipments/" + encodeURIComponent(shipmentId) + "/assignments", { cache:"no-store" })
          .then(function(r){ return r.json(); })
          .then(function(j){
            // Route reachable but its chain read failed → retry from the browser.
            return j.error ? loadAssignmentsFromChain() : j;
          })
          .catch(function(){ return loadAssignmentsFromChain(); })
          .then(function(res){
            if (!res.count) {
              body.outerHTML = '<p class="muted" id="devicesBody">No devices assigned yet. ' +
                'A device appears here once it calls <code>assign_device</code> against this shipment.</p>';
              return;
            }
            var rows = res.assignments.map(function(a){
              var active = !a.ended_at;
              return '<tr>' +
                '<td><span title="'+esc(a.device_pubkey)+'">'+esc(shortKey(a.device_pubkey))+'</span>' +
                  '<button class="copy-btn" onclick="copyId(this,\''+esc(a.device_pubkey)+'\')" title="Copy device address">copy</button></td>' +
                '<td>'+esc(a.sequence)+'</td>' +
                '<td>'+esc(a.proof_count)+'</td>' +
                '<td>'+esc(fmtTs(a.assigned_at))+'</td>' +
                '<td class="'+(active?"ok":"ended")+'">'+(active?"Active":"Ended "+esc(fmtTs(a.ended_at)))+'</td>' +
                '<td><a href="https://solscan.io/account/'+esc(a.device_pubkey)+'?cluster=devnet" target="_blank" rel="noopener">Solscan ↗</a></td>' +
              '</tr>';
            }).join("");
            body.outerHTML =
              '<div class="dev-tablewrap"><table class="dev-table"><thead><tr>' +
                '<th>Device</th><th>Seq</th><th>Proofs</th><th>Assigned</th><th>Status</th><th></th>' +
              '</tr></thead><tbody>' + rows + '</tbody></table></div>';
          })
          .catch(function(err){
            // Both the Worker route and the direct browser read failed.
            body.outerHTML = '<p class="muted" id="devicesBody">Could not read assigned devices from Solana: ' +
              esc(err && err.message ? err.message : "network error") + '</p>';
          });
      }

      if (!shipmentId || shipmentId === "shipment.html") {
        contentEl.innerHTML = '<p class="muted">No shipment id in the URL.</p>'; return;
      }

      fetch("/api/shipments/get?id=" + encodeURIComponent(shipmentId), { cache:"no-store" })
        .then(function(r){ return r.json().then(function(j){ return { status:r.status, j:j }; }); })
        .then(function(res){
          var s = res.j.shipment;
          var metaHtml, headHtml;
          if (!res.j.ok) {
            headHtml = '<h1>Shipment</h1>';
            metaHtml = '<div class="card"><h2>Metadata</h2><p class="muted">Unable to load metadata: '+esc(res.j.error||"not found")+'</p></div>';
          } else {
            headHtml = '<h1>'+esc(s.name)+'</h1><span class="tier-badge tier-'+esc(s.tier)+'">'+esc(s.tier)+'</span>';
            var tempR = (s.temp_c_min==null&&s.temp_c_max==null)?"—":(s.temp_c_min+" to "+s.temp_c_max+" °C");
            metaHtml =
              '<div class="card"><h2>Shipment</h2>' +
                row("Shipment ID", '<span title="'+esc(s.shipment_id)+'">'+esc(s.shipment_id)+'</span><button class="copy-btn" onclick="copyId(this,\''+esc(s.shipment_id)+'\')">copy</button>') +
                row("Tier", esc(s.tier)) +
                row("Temperature range", esc(tempR)) +
                row("Duration", esc(s.duration_days)+" days") +
                row("Devices", esc(s.num_devices)) +
                row("Origin", esc(s.origin||"—")) +
                row("Destination", esc(s.destination||"—")) +
                row("Notes", esc(s.notes||"—")) +
                row("Created", esc(s.created_at)) +
              '</div>' +
              '<div class="card"><h2>On-chain</h2>' +
                row("Network", esc(s.network||"devnet")) +
                row("Create transaction", s.create_sig ? '<a href="https://solscan.io/tx/'+esc(s.create_sig)+'?cluster=devnet" target="_blank" rel="noopener">'+esc(s.create_sig.slice(0,10))+'… ↗</a>' : "—") +
                row("Shipment account", '<a href="https://solscan.io/account/'+esc(s.shipment_id)+'?cluster=devnet" target="_blank" rel="noopener">view on Solscan ↗</a>') +
                '<div class="row"><span class="k">Chain status</span><span class="v" id="chainStatus"><span class="onchain-dot"></span>checking…</span></div>' +
              '</div>';
          }

          var devicesHtml = '<div class="card" id="devicesCard"><h2>Assigned Devices</h2>' +
                            '<p class="muted" id="devicesBody">Reading assignments from devnet…</p></div>';
          var actionsHtml = '<div class="actions"><a class="btn-primary" href="/operator/dashboard?shipment='+encodeURIComponent(shipmentId)+'">Dashboard →</a>' +
                            '<a class="btn-secondary" href="/verify/'+encodeURIComponent(shipmentId)+'" target="_blank" rel="noopener">View Verify Page ↗</a>' +
                            '<a class="btn-secondary" href="/operator/">Back to list</a></div>';
          contentEl.innerHTML = headHtml + metaHtml + devicesHtml + actionsHtml;

          // Assigned devices, straight from the chain via the assignments route.
          loadAssignments();

          // Light on-chain existence check (browser IP is not blocked like CF's).
          var statusEl = document.getElementById("chainStatus");
          if (statusEl) {
            fetch(DEVNET_RPC, { method:"POST", headers:{"content-type":"application/json"},
              body: JSON.stringify({jsonrpc:"2.0",id:1,method:"getAccountInfo",params:[shipmentId,{encoding:"base64"}]}) })
              .then(function(r){ return r.json(); })
              .then(function(j){
                var v = j.result && j.result.value;
                if (v) statusEl.innerHTML = '<span class="onchain-dot ok"></span>confirmed on devnet';
                else statusEl.innerHTML = '<span class="onchain-dot bad"></span>not found on-chain yet';
              })
              .catch(function(){ statusEl.innerHTML = '<span class="onchain-dot bad"></span>unable to load chain'; });
          }
        })
        .catch(function(){ contentEl.innerHTML = '<p class="muted">Unable to load shipment.</p>'; });
    })();
  </script>
</body>
</html>
