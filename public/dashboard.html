<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>April Gate — Dashboard</title>
  <!--
    The old global dashboard lived here. It rendered fabricated sensor nodes, a
    Math.random() temperature timeline, a chain/storage switcher ("Arweave") and
    an events feed — none of it backed by a real source. Dashboards are now
    per-shipment and show only real data:

        /operator/dashboard?shipment=<shipment id>

    The original file is preserved at demo/dashboard.html (outside the served
    directory) so the visuals are still available for pitch material; it is just
    no longer reachable on the public site.
  -->
  <link rel="canonical" href="/operator/" />
  <meta http-equiv="refresh" content="0; url=/operator/" />
  <script>location.replace("/operator/");</script>
  <link rel="stylesheet" href="/theme.css">
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    body { font-family:'DM Sans',system-ui,sans-serif; background:var(--bg,#fff); color:var(--text,#222);
           display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; text-align:center; }
    a { color:var(--accent,#0aa); }
  </style>
</head>
<body>
  <p>Dashboards are per-shipment now. <a href="/operator/">Choose a shipment →</a></p>
</body>
</html>
