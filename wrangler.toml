# Cloudflare Pages config for coldchain-web.
#
# This file is only needed for the waitlist backend (functions/waitlist.js).
# It declares the D1 binding as code so `wrangler pages dev` works locally and
# the binding is version-controlled. If you'd rather configure the binding in
# the Cloudflare dashboard instead (Pages project → Settings → Functions → D1
# bindings), you can delete this file — the static site deploys fine without it.
#
# IMPORTANT: pages_build_output_dir must match your Pages "build output
# directory" (the folder holding index.html). This repo serves from public/.

name = "coldchain-web"
pages_build_output_dir = "public"

# D1 database that stores waitlist signups. Create it once with:
#   wrangler d1 create aprilgate-waitlist
# then paste the printed database_id below.
[[d1_databases]]
binding = "WAITLIST_DB"
database_name = "aprilgate-waitlist"
database_id = "PASTE_DATABASE_ID_HERE"

# ── Optional: per-signup founder email via Resend ──
# Set RESEND_API_KEY as an *encrypted* var/secret in the dashboard (don't commit
# it). NOTIFY_TO / NOTIFY_FROM can live here as plain vars if you like.
# [vars]
# NOTIFY_TO   = "irina@aprilgatehq.com"
# NOTIFY_FROM = "April Gate Waitlist <waitlist@aprilgatehq.com>"