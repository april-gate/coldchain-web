# Cloudflare Pages config for coldchain-web.
#
# Declares the D1 binding (as code, so `wrangler pages dev` works locally) and
# non-secret vars. Secrets are NOT here — set them with `wrangler pages secret
# put`. pages_build_output_dir must match your Pages "build output directory"
# (the folder holding index.html). This repo serves from public/.

name = "aprilgate"
pages_build_output_dir = "public"

# @solana/web3.js (used by the create-shipment Worker route) relies on Node's
# Buffer, so enable nodejs_compat. Keep the date recent enough for the flag.
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# One D1 database (binding WAITLIST_DB) holds every app table:
#   signups   (schema.sql)          — waitlist
#   loi + loi_tokens (schema/loi.sql) — Letters of Intent + magic-link tokens
#   readings  (schema/readings.sql)  — temperature telemetry
# Create it once, then paste the printed database_id below:
#   npx wrangler d1 create aprilgate-waitlist
#   npx wrangler d1 execute aprilgate-waitlist --file=./schema.sql          --remote
#   npx wrangler d1 execute aprilgate-waitlist --file=./schema/loi.sql      --remote
#   npx wrangler d1 execute aprilgate-waitlist --file=./schema/readings.sql --remote
[[d1_databases]]
binding = "WAITLIST_DB"
database_name = "aprilgate-waitlist"
database_id = "689b7c00-2c7f-45c2-b7f0-e2c39f981905"

# Non-secret vars. Override in the dashboard if you prefer.
[vars]
NOTIFY_TO       = "aprilgatehq@gmail.com"                    # where founder signup alerts land
NOTIFY_FROM     = "April Gate <waitlist@aprilgatehq.com>"   # requires aprilgatehq.com verified in Resend
PUBLIC_BASE_URL = "https://aprilgatehq.com"                 # base for magic-link URLs

# ── Secrets — set these with wrangler, never commit them ──
#   npx wrangler pages secret put RESEND_API_KEY   # enables Resend email
#   npx wrangler pages secret put INGEST_KEY       # shared secret for /api/ingest